trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  NODE_VERSION: '20.x'
  GCP_REGION: us-central1
  GCP_REPOSITORY: metamcp
  CLOUD_RUN_SERVICE: metamcp-gateway

stages:
  - stage: test
    displayName: Build and test
    jobs:
      - job: node
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)
          - script: npm ci
            displayName: Install dependencies
          - script: npm run typecheck
            displayName: Typecheck
          - script: npm test
            displayName: Test

  - stage: deploy
    displayName: Deploy to Cloud Run
    dependsOn: test
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: cloud_run
        pool:
          vmImage: ubuntu-latest
        steps:
          - script: |
              curl -sSL https://sdk.cloud.google.com | bash -s -- --disable-prompts --install-dir="$HOME"
              echo "##vso[task.prependpath]$HOME/google-cloud-sdk/bin"
              "$HOME/google-cloud-sdk/bin/gcloud" version
            displayName: Install Google Cloud CLI
          - script: |
              echo "$GCP_SERVICE_ACCOUNT_KEY" > "$(Pipeline.Workspace)/gcp-key.json"
              gcloud auth activate-service-account --key-file="$(Pipeline.Workspace)/gcp-key.json"
              gcloud config set project "$GCP_PROJECT_ID"
              gcloud builds submit \
                --config cloudbuild.yaml \
                --substitutions "_REGION=$(GCP_REGION),_REPOSITORY=$(GCP_REPOSITORY),_SERVICE=$(CLOUD_RUN_SERVICE)" \
                .
            displayName: Submit Cloud Build
            env:
              GCP_PROJECT_ID: $(GCP_PROJECT_ID)
              GCP_SERVICE_ACCOUNT_KEY: $(GCP_SERVICE_ACCOUNT_KEY)
